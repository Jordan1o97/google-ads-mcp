name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black nox
      - name: Run lint
        run: nox -s lint

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nox
      - name: Run tests
        run: nox -s tests-${{ matrix.python-version }}

  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nox .
      - name: Run smoke tests
        run: nox -s smoke_tests
      - name: Capture observed tool list on failure
        if: failure()
        run: |
          python -c 'import json; from tests.smoke import smoke_utils; data=smoke_utils.get_tools_list(); data["tools"].sort(key=lambda x: x.get("name", "")); open("actual-tools.json", "w").write(json.dumps(data, indent=2, sort_keys=True)+"\n")'
      - name: Upload observed tool list
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: observed-tools
          path: actual-tools.json
          if-no-files-found: error

  llm-tests:
    if: ${{ false }} # Requires a paid external API and is never run automatically.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nox . google-genai
      - name: Run LLM tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: nox -s llm_tests
